name: E2E test

on:
  workflow_dispatch:
  push:
    branches:
    - master

permissions:
  contents: read

concurrency:
  group: e2e-test
  cancel-in-progress: false

jobs:
  test:
    name: Run launcher tests
    runs-on: self-hosted
    timeout-minutes: 150

    steps:
      - name: Reset runner
        shell: bash
        run: |
          set -euo pipefail
          sudo modprobe br_netfilter
          sudo sysctl -w net.bridge.bridge-nf-call-iptables=1
          if [ -f "$GITHUB_WORKSPACE/.compose/docker-compose.yaml" ]; then
            docker compose --project-name compose --project-directory "$GITHUB_WORKSPACE/.compose" down -v --remove-orphans
          fi
          docker ps -aq --filter label=com.docker.compose.project=compose | xargs -r docker rm -f
          docker volume ls -q --filter label=com.docker.compose.project=compose | xargs -r docker volume rm -f
          docker network ls -q --filter label=com.docker.compose.project=compose | xargs -r docker network rm || true
          available_kb="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          if [ -n "$available_kb" ] && [ "$available_kb" -lt 20971520 ]; then
            docker image prune --all --force
            docker builder prune --all --force
          fi
          docker image prune --force
          sudo rm -rf "$GITHUB_WORKSPACE/.compose"
          sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: 'true'

      - name: Verify toolchain
        run: |
          go version
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Install frontend dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd frontend-web/webclient
          npm ci

      - name: Run init-test
        shell: bash
        timeout-minutes: 30
        run: |
          set -euo pipefail
          export UCLOUD_GO_CACHE_DIR=$HOME/go-cache
          export UCLOUD_LAUNCHER_PROFILE=ci
          ./launcher init-test

      - name: Remove dangling docker images
        shell: bash
        run: |
          docker image prune --force

      - name: Run test
        shell: bash
        timeout-minutes: 90
        run: |
          set -euo pipefail
          export UCLOUD_GO_CACHE_DIR=$HOME/go-cache
          export UCLOUD_LAUNCHER_PROFILE=ci
          ./launcher test

      - name: Collect frontend logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-name compose --project-directory "$GITHUB_WORKSPACE/.compose" logs frontend > "$GITHUB_WORKSPACE/.compose/frontend.log" || true

      - name: Collect Kubernetes debug info
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          docker exec compose-k3s-1 k3s kubectl get pods -n ucloud-apps -o wide > "$GITHUB_WORKSPACE/.compose/k8s-pods.txt" || true
          docker exec compose-k3s-1 k3s kubectl get events -n ucloud-apps --sort-by=.lastTimestamp > "$GITHUB_WORKSPACE/.compose/k8s-events.txt" || true
          docker exec compose-k3s-1 k3s kubectl describe pods -n ucloud-apps > "$GITHUB_WORKSPACE/.compose/k8s-pods-describe.txt" || true

      - name: Fix log permissions
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          for path in .compose/*-logs .compose/k8s-storage/home; do
            if [ -e "$path" ]; then
              sudo chown -R "$USER:$USER" "$path"
            fi
          done

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend-web/webclient/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload log files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .compose/frontend.log
            .compose/k8s-*.txt
            .compose/k8s-logs/*
            .compose/core-logs/*
            .compose/slurm-logs/*
            .compose/k8s-storage/home/*
          if-no-files-found: warn
          retention-days: 14

      - name: Reset runner
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/.compose/docker-compose.yaml" ]; then
            docker compose --project-name compose --project-directory "$GITHUB_WORKSPACE/.compose" down -v --remove-orphans
          fi
          docker ps -aq --filter label=com.docker.compose.project=compose | xargs -r docker rm -f
          docker volume ls -q --filter label=com.docker.compose.project=compose | xargs -r docker volume rm -f
          docker network ls -q --filter label=com.docker.compose.project=compose | xargs -r docker network rm || true
          docker image prune --force
          sudo rm -rf "$GITHUB_WORKSPACE/.compose"
          sudo chown -R "$USER:$USER" "$GITHUB_WORKSPACE"

apiVersion: v1
kind: Namespace
metadata:
  name: ucloud-storage
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ucloud-storage-provisioner
  namespace: ucloud-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ucloud-storage-provisioner-role
  namespace: ucloud-storage
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ucloud-storage-provisioner-bind
  namespace: ucloud-storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ucloud-storage-provisioner-role
subjects:
  - kind: ServiceAccount
    name: ucloud-storage-provisioner
    namespace: ucloud-storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ucloud-storage-provisioner-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "configmaps", "pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ucloud-storage-provisioner-bind
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ucloud-storage-provisioner-role
subjects:
  - kind: ServiceAccount
    name: ucloud-storage-provisioner
    namespace: ucloud-storage
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ucloud-storage-config
  namespace: ucloud-storage
data:
  config.json: |-
    {
      "nodePathMap": [],
      "sharedFileSystemPath": "${STORAGE_DIR}"
    }
  setup: |-
    #!/bin/sh
    set -eu
    mkdir -m 0777 -p "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu
    rm -rf "$VOL_DIR"
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
      - name: helper-pod
        image: ${UCLOUD_STORAGE_HELPER_IMAGE}
        imagePullPolicy: IfNotPresent
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ucloud-storage-provisioner
  namespace: ucloud-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ucloud-storage-provisioner
  template:
    metadata:
      labels:
        app: ucloud-storage-provisioner
    spec:
      serviceAccountName: ucloud-storage-provisioner
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: ucloud-storage-provisioner
          image: ${UCLOUD_STORAGE_PROVISIONER_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - --debug
            - start
            - --config
            - /etc/config/config.json
            - --service-account-name
            - ucloud-storage-provisioner
            - --provisioner-name
            - rancher.io/local-path
            - --helper-image
            - ${UCLOUD_STORAGE_HELPER_IMAGE}
            - --configmap-name
            - ucloud-storage-config
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
            - name: HEALTH_PORT
              value: "8080"
      volumes:
        - name: config-volume
          configMap:
            name: ucloud-storage-config
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: ucloud-storage
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

name: "RestrictApiTokens"
title: "Restrict API tokens"

description: >
  Controls whether API tokens may be used with this project. API tokens
  allow programmatic access to project data and resources without the
  interactive authentication flow (e.g. multi-factor authentication)
  that governs user sessions.

configuration:
  enabled:
    title: "Enabled"
    description: >
      If enabled, API tokens cannot be used in the project. Existing
      tokens are _not_ deleted, but they are rejected while this policy
      is enabled.
name: "RestrictInternetAccess"
title: "Restrict Internet access"

description: >
  Restricts outbound Internet connectivity for workloads belonging to the project.

configuration:
  enabled:
    title: "Enabled"
    description: >
      If enabled, the project will only be able to access destinations that are
      allowed by this policy.
      If disabled, workloads have unrestricted outbound Internet access (within
      the regular network limitations).

  allowedSubnets:
    title: "Allowed subnets"
    description: >
      A single subnet range (CIDR notation) of destination subnets that workloads 
      in the project are allowed to access.
      
      No value indicates that no outbound Internet access is allowed.
    
      Any additions to the subnet will allow workloads to access destinations
      within the specified subnets.
    
      This configuration only affects outbound Internet connectivity from
      workloads belonging to the project.
